<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelWise AI - Trip Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px #00000012;
        }

        h1 { color: #2563eb; }
        p { line-height: 1.5; color: #64748b; }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        #result {
            margin-top: 22px;
            padding: 16px;
            background: #eff6ff;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>FuelWise AI 🚗</h1>
    <p>Plan your next road trip. Estimate your fuel consumption and total travel costs before you leave.</p>

    <form id="fuelForm">
        <label for="distance">Trip distance (miles)</label>
        <input id="distance" type="number" min="0.01" step="any" required placeholder="Example: 250">

        <label for="mpg">Vehicle fuel economy (MPG)</label>
        <input id="mpg" type="number" min="0.01" step="any" required placeholder="Example: 28">

        <label for="price">Gas price per gallon ($)</label>
        <input id="price" type="number" min="0" step="any" required placeholder="Example: 3.49">

        <label for="extras">Additional expenses ($)</label>
        <input id="extras" type="number" min="0" step="any" value="0" required>

        <button type="submit">Calculate Trip Cost</button>
    </form>

    <div id="result" aria-live="polite"></div>
</div>

<script>
document.getElementById("fuelForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const distance = Number(document.getElementById("distance").value);
    const mpg = Number(document.getElementById("mpg").value);
    const price = Number(document.getElementById("price").value);
    const extras = Number(document.getElementById("extras").value);

    if (distance <= 0 || mpg <= 0 || price < 0 || extras < 0) {
        alert("Please enter valid numbers.");
        return;
    }

    const gallons = distance / mpg;
    const fuelCost = gallons * price;
    const total = fuelCost + extras;

    const result = document.getElementById("result");
    result.style.display = "block";
    result.innerHTML = `
        <h2>Trip Cost Estimate</h2>
        <p>Fuel needed: <strong>${gallons.toFixed(2)} gallons</strong></p>
        <p>Fuel cost: <strong>$${fuelCost.toFixed(2)}</strong></p>
        <p>Additional expenses: <strong>$${extras.toFixed(2)}</strong></p>
        <h3>Estimated total: $${total.toFixed(2)}</h3>
    `;
});
</script>
</body>
</html>
